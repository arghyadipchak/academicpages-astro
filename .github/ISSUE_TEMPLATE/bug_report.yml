name: 🐛 Bug Report
description: Create a report to help us fix a bug
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for contributing to Academic Pages Astro!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Clear steps to reproduce the issue.
      placeholder: |
        1. Run 'pnpm dev'
        2. Navigate to '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: Node version, OS, Browser, etc.
      placeholder: |
        - OS: Linux / macOS / Windows
        - Node version: v22.x
        - Browser: Chrome / Safari / Firefox
