version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
    commit-message:
      prefix: build(deps)
      prefix-development: chore(deps)
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: prettier-plugin-astro
        versions: ['>= 1.0.0']
    groups:
      npm-packages:
        dependency-type: production
        patterns: ['*']
        update-types: ['minor', 'patch']
      npm-dev-packages:
        dependency-type: development
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    commit-message:
      prefix: ci(deps)
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ['*']
