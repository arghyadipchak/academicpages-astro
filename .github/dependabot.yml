version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
    commit-message:
      prefix: build
      prefix-development: chore
      include: scope
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: prettier-plugin-astro
        versions: ['>= 1.0.0']
    groups:
      npm-packages:
        dependency-type: production
        patterns: ['*']
        update-types: ['minor', 'patch']
      npm-dev-packages:
        dependency-type: development
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    commit-message:
      prefix: ci
      include: scope
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ['*']
